<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon-32x32.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
    <meta name="theme-color" content="#030201" />
    <meta name="description" content="ELARA — Rare fragrances, meticulously composed for those who demand nothing less than extraordinary. Handcrafted luxury perfumes delivered across Lebanon." />

    <!-- Open Graph -->
    <meta property="og:type"         content="website" />
    <meta property="og:url"          content="https://elaraperfume.online/" />
    <meta property="og:title"        content="ELARA — The Art of Scent" />
    <meta property="og:description"  content="Rare fragrances, meticulously composed. Handcrafted luxury perfumes delivered across Lebanon." />
    <meta property="og:image"        content="https://elaraperfume.online/ELARAREINE.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name"    content="ELARA Perfume" />

    <!-- Twitter / WhatsApp card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="ELARA — The Art of Scent" />
    <meta name="twitter:description" content="Rare fragrances, meticulously composed. Delivered across Lebanon." />
    <meta name="twitter:image"       content="https://elaraperfume.online/ELARAREINE.png" />

    <!-- Preconnect for Google Fonts — connection established before CSS requests fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Google Fonts as <link> — discovered on HTML parse, not blocked by CSS -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Playfair+Display:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500&family=Raleway:wght@200;300;400;500;600&display=swap"
    />

    <!-- Preload hero — highest priority fetch, eliminates LCP delay -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/elaraaaaa.webp" fetchpriority="high" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <title>ELARA — The Art of Scent</title>

    <!-- EmailJS deferred — does not block HTML parse or first paint -->
    <script defer src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root" class="app-shell"></div>
  </body>
</html>
